name: Run Objective 2 analysis
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python analysis_objective2.py
      - run: python analysis_week9.py
      - uses: actions/upload-artifact@v4
        with:
          name: objective2-results
          path: |
            results/
            figures/
            week9_results/
